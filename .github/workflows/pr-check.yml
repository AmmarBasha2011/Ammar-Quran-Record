name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate (block merge on failure)
        id: validate
        run: |
          python - <<'PY'
          import os, json, sys
          REPO = "."
          av = json.load(open("available.json", encoding="utf-8"))
          surahs = av.get("surahs", {})
          errors = []
          disk = [d for d in os.listdir(REPO)
                  if d.isdigit() and os.path.isdir(os.path.join(REPO, d))
                  and os.path.exists(os.path.join(REPO, d, "001.mp3"))]
          if set(disk) != set(surahs.keys()):
              errors.append(f"surah set mismatch: disk={len(disk)} json={len(surahs)}")
          for key in sorted(surahs, key=int):
              dp = os.path.join(REPO, key)
              s = surahs[key]
              if not os.path.exists(os.path.join(dp, "_report.json")):
                  errors.append(f"{key}: missing _report.json")
              exp = s.get("ayahs", 0)
              have = [f for f in os.listdir(dp) if f.endswith(".mp3") and len(f) == 7]
              if len(have) != exp:
                  errors.append(f"{key}: ayah count {len(have)} != expected {exp}")
              for fld in ("min_sim", "avg_sim", "weak_ayahs", "manual_revise"):
                  if fld not in s:
                      errors.append(f"{key}: missing metric {fld}")
          if errors:
              print("VALIDATION FAILED:")
              for e in errors: print("  -", e)
              sys.exit(1)
          print(f"OK: {len(surahs)} surahs validated")
          PY
      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ steps.validate.outcome }}" === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ok
                ? "✅ Archive validation passed — ready to merge."
                : "❌ Archive validation failed. See the Checks tab for details before merging."
            });
