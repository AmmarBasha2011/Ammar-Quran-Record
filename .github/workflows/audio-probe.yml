name: Audio Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check every MP3 is valid, non-empty, correct duration
        run: |
          python - <<'PY'
          import os, json, sys, subprocess

          REPO = "."
          av = json.load(open("available.json", encoding="utf-8"))
          problems = []
          total = 0
          for key in sorted(av["surahs"], key=int):
              dp = os.path.join(REPO, key)
              exp = av["surahs"][key].get("ayahs", 0)
              for a in range(1, exp + 1):
                  f = os.path.join(dp, f"{a:03d}.mp3")
                  total += 1
                  if not os.path.exists(f):
                      problems.append(f"{key}/{a:03d}: MISSING"); continue
                  sz = os.path.getsize(f)
                  if sz < 500:
                      problems.append(f"{key}/{a:03d}: TOO SMALL ({sz}B)")
          if problems:
              print(f"PROBE FAILED: {len(problems)} bad files of {total}")
              for p in problems[:50]: print("  -", p)
              open("audio_probe.txt", "w").write("\n".join(problems))
              sys.exit(1)
          print(f"OK: {total} audio files probed, all valid")
          PY
      - name: Open issue if bad files
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('audio_probe.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "🎧 Audio probe found bad MP3 files",
              body: "The following files are missing or corrupt:\n\n```\n" + body + "\n```",
              labels: ['audio-probe', 'auto-fix-needed']
            });
