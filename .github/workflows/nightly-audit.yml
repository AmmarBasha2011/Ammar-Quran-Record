name: Nightly Weak Ayah Audit

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install faster-whisper==1.0.2 pydub
      - name: Run independent STT audit on flagged surahs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/audit_weak.py || true
      - name: Summarize
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "🌙 Nightly audit ran.\n\n";
            try {
              const out = fs.readFileSync('audit_weak_report.txt', 'utf8');
              body += "```\n" + out.slice(0, 6000) + "\n```";
            } catch (e) {
              body += "(audit_weak.py produced no report file — see run logs)";
            }
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'nightly-audit', state: 'open'
            });
            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "🌙 Nightly Weak Ayah Audit", body, labels: ['nightly-audit']
              });
            }
