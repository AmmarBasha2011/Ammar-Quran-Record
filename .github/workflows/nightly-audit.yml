name: Nightly Weak Ayah Audit

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install faster-whisper==1.0.2 pydub
      - name: Collect weak ayahs from available.json
        run: |
          python - <<'PY'
          import json
          av = json.load(open("available.json", encoding="utf-8"))["surahs"]
          lines = []
          total = 0
          for key in sorted(av, key=int):
              s = av[key]
              if s.get("manual_revise") and s.get("weak_ayahs"):
                  name = s.get("name", f"surah {key}")
                  lines.append(f"### {int(key):03d} — {name} ({len(s['weak_ayahs'])} weak)")
                  lines.append(", ".join(str(a) for a in s["weak_ayahs"]))
                  lines.append("")
                  total += len(s["weak_ayahs"])
          with open("audit_weak_report.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          print(f"collected {total} weak ayahs across {len(lines)//3} surahs")
          PY
      - name: Summarize
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "🌙 Nightly audit ran.\n\n";
            try {
              const out = fs.readFileSync('audit_weak_report.txt', 'utf8');
              body += "```\n" + out.slice(0, 6000) + "\n```";
            } catch (e) {
              body += "(audit produced no report file — see run logs)";
            }
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'nightly-audit', state: 'open'
            });
            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "🌙 Nightly Weak Ayah Audit", body, labels: ['nightly-audit']
              });
            }
