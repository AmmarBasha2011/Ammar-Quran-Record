name: Auto-Fix Dispatcher

on:
  workflow_dispatch:
  repository_dispatch:
    types: [validation-failed]

permissions:
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Hermes agent
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔧 Auto-fix requested — archive validation failed`,
              body: `The \`validate\` workflow detected a problem with the archive.\n\nRun: ${runUrl}\n\n@hermes-agent please investigate, fix the issue, and push the correction.`,
              labels: ['auto-fix-needed', 'validation-failed']
            });
            console.log("Auto-fix issue opened");
