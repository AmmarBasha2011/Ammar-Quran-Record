name: Validate Archive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate structure
        run: |
          python - <<'PY'
          import os, json, sys

          REPO = "."
          # 1) available.json exists & valid
          av_path = os.path.join(REPO, "available.json")
          if not os.path.exists(av_path):
              print("FAIL: available.json missing"); sys.exit(1)
          av = json.load(open(av_path, encoding="utf-8"))

          surahs = av.get("surahs", {})
          errors = []

          # 2) every published surah folder matches available.json
          disk = [d for d in os.listdir(REPO)
                  if d.isdigit() and os.path.isdir(os.path.join(REPO, d))
                  and os.path.exists(os.path.join(REPO, d, "001.mp3"))]
          if set(disk) != set(surahs.keys()):
              errors.append(f"surah set mismatch: disk={len(disk)} json={len(surahs)}")

          for key in sorted(surahs, key=int):
              dp = os.path.join(REPO, key)
              s = surahs[key]
              # 3) _report.json present
              if not os.path.exists(os.path.join(dp, "_report.json")):
                  errors.append(f"{key}: missing _report.json")
              # 4) expected ayah files exist
              exp = s.get("ayahs", 0)
              have = [f for f in os.listdir(dp) if f.endswith(".mp3") and len(f) == 7]
              if len(have) != exp:
                  errors.append(f"{key}: ayah count {len(have)} != expected {exp}")
              # 5) metrics present
              for fld in ("min_sim", "avg_sim", "weak_ayahs", "manual_revise"):
                  if fld not in s:
                      errors.append(f"{key}: missing metric {fld}")

          if errors:
              print("VALIDATION FAILED:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          print(f"OK: {len(surahs)} surahs validated, {av['total_ayat']} ayat")
          PY

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = `🚨 Archive validation failed on ${context.sha.slice(0,7)}`;
            const body = `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe archive validation failed. @hermes-agent please investigate and auto-fix.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['validation-failed', 'auto-fix-needed']
            });
