name: Weak Ayah Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  weak-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build weak report
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json

          REPO = "."
          av = json.load(open("available.json", encoding="utf-8"))
          links = json.load(open("links.json", encoding="utf-8")).get("links", {})
          repo_name = os.environ.get("GITHUB_REPOSITORY", "AmmarBasha2011/Ammar-Quran-Record")

          weak = []
          for key in sorted(av["surahs"], key=int):
              s = av["surahs"][key]
              if s.get("manual_revise") and s.get("weak_ayahs"):
                  name = links.get(key, {}).get("name", "?")
                  weak.append((key, name, s["weak_ayahs"], s.get("min_sim")))

          lines = [f"# Weak Ayahs Report — {len(weak)} surahs need review\n"]
          for key, name, ayahs, msim in weak:
              lines.append(f"## {key} {name} (min_sim={msim})")
              for a in ayahs:
                  lines.append(f"- [{key}/{a:03d}](https://raw.githubusercontent.com/{repo_name}/main/{key}/{a:03d}.mp3) — ayah {a}")
              lines.append("")
          open("weak_report.md", "w", encoding="utf-8").write("\n".join(lines))
          print(f"Wrote weak_report.md with {len(weak)} surahs")
          PY

      - name: Open / update issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('weak_report.md', 'utf8');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'weak-ayahs',
              state: 'open'
            });
            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body
              });
              console.log("Updated issue #" + issues.data[0].number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "📋 Weak Ayahs — manual review needed",
                body,
                labels: ['weak-ayahs']
              });
              console.log("Created weak-ayahs issue");
            }
