name: Available JSON Drift

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare available.json vs disk files
        run: |
          python - <<'PY'
          import os, json, sys

          REPO = "."
          av = json.load(open("available.json", encoding="utf-8"))
          surahs = av.get("surahs", {})

          drift = []

          # 1) ayah count in json vs actual mp3s on disk
          for key in sorted(surahs, key=int):
              dp = os.path.join(REPO, key)
              exp = surahs[key].get("ayahs", 0)
              have = len([f for f in os.listdir(dp) if f.endswith(".mp3") and len(f) == 7]) \
                     if os.path.isdir(dp) else 0
              if have != exp:
                  drift.append(f"{key}: available.json says {exp} ayahs but {have} mp3 files on disk")

          # 2) every published folder must be listed in available.json
          disk = [d for d in os.listdir(REPO)
                  if d.isdigit() and os.path.isdir(os.path.join(REPO, d))
                  and os.path.exists(os.path.join(REPO, d, "001.mp3"))]
          for d in disk:
              if d not in surahs:
                  drift.append(f"{d}: published on disk but missing from available.json")

          # 3) total fields consistency
          if disk_total := len(disk) != av.get("total_surahs"):
              drift.append(f"total_surahs={av.get('total_surahs')} but {len(disk)} folders on disk")

          if drift:
              print("DRIFT DETECTED:")
              for d in drift: print("  -", d)
              open("drift.txt", "w").write("\n".join(drift))
              sys.exit(1)
          print(f"OK: available.json matches disk ({len(disk)} surahs)")
          PY
      - name: Open issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "⚠️ available.json drift detected",
              body: "Mismatch between available.json and disk files:\n\n```\n" + body + "\n```\n\nPlease rebuild available.json.",
              labels: ['drift', 'auto-fix-needed']
            });
